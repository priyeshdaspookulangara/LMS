// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.2.2' apply false // Check for the latest stable version
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false // Use version compatible with your Android Gradle Plugin
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
